<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sun-sid — Kundali</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="container">
  <header><h1>Kundali Calculator</h1><p id="userInfo"></p><button id="logoutButton" type="button">Logout</button></header>
  <form id="astroForm">
    <input type="date" id="dob" required />
    <input type="time" id="tob" required />
    <input type="text" id="place" placeholder="Place of Birth" required />
    <button type="submit">Calculate</button>
  </form>
  <pre id="result"></pre>
</div>
<script type="module">
import { watchAuth, logout } from "./auth.js";
const userInfo=document.getElementById("userInfo");
watchAuth(user => {
  if (!user) { window.location.replace("auth/login.html"); return; }
  userInfo.textContent = user.displayName ? `Signed in as ${user.displayName}` : `Signed in as ${user.email}`;
});
document.getElementById("logoutButton").addEventListener("click", async () => {
  await logout();
  window.location.replace("auth/login.html");
});
</script>
<script src="script.js"></script>
</body>
</html>
